<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的事宜</title>
    <link rel="stylesheet" href="https://unpkg.com/element-ui@2.15.14/lib/theme-chalk/index.css">
    <script src="https://unpkg.com/vue@2.5.16/dist/vue.min.js"></script>
    <script src="https://unpkg.com/element-ui@2.15.14/lib/index.js"></script>
    <script src="https://unpkg.com/axios@1.7.9/dist/axios.min.js"></script>
    <script src="../js/api.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.30.1/moment.min.js"></script>
    <link rel="stylesheet" href="../css/my_matters.css">
    <link rel="stylesheet" href="../css/common.css">
</head>
<body class="my-matters-page">
<div id="my_matters">
    <!-- ── 顶栏 ── -->
    <div class="topbar">
        <div class="topbar-brand">
            <div class="topbar-icon">
                <svg width="18" height="18" viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-9 14l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>
            </div>
            <h2>我的事宜</h2>
        </div>
        <div class="topbar-sep"></div>
        <span class="topbar-sys">证券投资管理系统</span>
        <div class="topbar-meta">
            <span class="topbar-date-badge">{{ today }}</span>
        </div>
    </div>

    <!-- ── 列表页 ── -->
    <div class="list-body">
        <!-- 搜索面板 -->
        <div class="search-panel">
            <div class="search-row">
                <span class="search-label"><i class="el-icon-search"></i>筛选</span>

                <template v-if="!isAlertTab">
                    <el-select v-model="searchForm.flowIds" placeholder="流程名称" clearable multiple collapse-tags size="small" style="width:220px;">
                        <el-option v-for="f in flowOptions" :key="f.flowId" :label="f.flowName" :value="f.flowId"></el-option>
                    </el-select>

                    <el-input v-model.trim="searchForm.securityCode" placeholder="证券编码" clearable size="small" style="width:140px;" @keyup.enter.native="handleSearch">
                        <i slot="prefix" class="el-input__icon el-icon-document"></i>
                    </el-input>

                    <el-input v-model.trim="searchForm.securityShortName" placeholder="证券名称" clearable size="small" style="width:140px;" @keyup.enter.native="handleSearch">
                        <i slot="prefix" class="el-input__icon el-icon-tickets"></i>
                    </el-input>

                    <el-date-picker
                        v-model="searchForm.startDateRange"
                        type="daterange"
                        popper-class="project-date-range-picker"
                        range-separator="至"
                        start-placeholder="开始日期"
                        end-placeholder="结束日期"
                        size="small"
                        style="width:240px;"
                        value-format="yyyy-MM-dd">
                    </el-date-picker>

                    <el-input v-model.trim="searchForm.processDescription" placeholder="流程描述" clearable size="small" style="width:220px;" @keyup.enter.native="handleSearch">
                        <i slot="prefix" class="el-input__icon el-icon-document"></i>
                    </el-input>

                    <el-input v-model.trim="searchForm.initiatorName" placeholder="发起人" clearable size="small" style="width:140px;" @keyup.enter.native="handleSearch">
                        <i slot="prefix" class="el-input__icon el-icon-user"></i>
                    </el-input>

                    <el-select v-model="searchForm.auditStatus" placeholder="审核状态" clearable size="small" style="width:130px;">
                        <el-option v-for="a in auditStatusOptions" :key="a.value" :label="a.label" :value="a.value"></el-option>
                    </el-select>
                </template>
                <template v-else>
                    <el-input v-model.trim="alertSearchForm.securityCode" placeholder="证券代码" clearable size="small" style="width:180px;" @keyup.enter.native="handleSearch">
                        <i slot="prefix" class="el-input__icon el-icon-document"></i>
                    </el-input>
                    <el-select v-model="alertSearchForm.alertStatus" placeholder="状态" clearable size="small" style="width:140px;">
                        <el-option label="待处理" value="00"></el-option>
                        <el-option label="已处理" value="20"></el-option>
                        <el-option label="已失效" value="99"></el-option>
                    </el-select>
                </template>

                <el-button type="primary" size="small" icon="el-icon-search" @click="handleSearch">查询</el-button>
                <el-button size="small" icon="el-icon-refresh" @click="handleReset">重置</el-button>

                <div class="total-badge">
                    <i class="el-icon-data-line"></i> {{ listTotalText }}
                </div>
            </div>
        </div>

        <!-- 事宜列表：待处理 / 已完成 / 分级规则提醒 -->
        <div class="table-card">
            <el-tabs v-model="activeTab" @tab-click="handleTabClick">
                <el-tab-pane name="pending">
                    <span slot="label">待处理 ({{ pendingCount }})</span>
                </el-tab-pane>
                <el-tab-pane name="completed">
                    <span slot="label">已完成 ({{ completedCount }})</span>
                </el-tab-pane>
                <el-tab-pane name="gradeRuleAlert">
                    <span slot="label">分级规则提醒 ({{ alertOpenCount }})</span>
                </el-tab-pane>
            </el-tabs>
            <el-table v-show="!isAlertTab" ref="mattersTableRef" :data="tableData" v-loading="loading" stripe border size="small" style="width:100%;" empty-text="暂无事宜">
                <el-table-column label="序号" width="72" align="center">
                    <template slot-scope="{ $index }">
                        {{ (pagination.pageIndex - 1) * pagination.pageSize + $index + 1 }}
                    </template>
                </el-table-column>
                <el-table-column prop="flowName" label="流程名称" min-width="160" show-overflow-tooltip></el-table-column>
                <el-table-column prop="stepName" label="步骤名称" min-width="140" show-overflow-tooltip></el-table-column>
                <el-table-column prop="securityCode" label="证券编码" min-width="130" show-overflow-tooltip></el-table-column>
                <el-table-column prop="securityShortName" label="证券名称" min-width="150" show-overflow-tooltip></el-table-column>
                <el-table-column label="流程描述" min-width="300" show-overflow-tooltip>
                    <template slot-scope="{ row }">
                        <span class="desc-link" @click="openMatterPage(row)">{{ row.processDescription || '' }}</span>
                    </template>
                </el-table-column>
                <el-table-column label="步骤状态" min-width="110">
                    <template slot-scope="{ row }">
                        <el-tag :type="stepStatusType(row.stepStatus)" size="mini" v-if="row.stepStatus != null">
                            {{ stepStatusLabel(row.stepStatus) }}
                        </el-tag>
                        <span v-else style="color:var(--c-text-3);"></span>
                    </template>
                </el-table-column>
                <el-table-column label="审核状态" min-width="110">
                    <template slot-scope="{ row }">
                        <el-tag :type="auditStatusType(row.auditStatus)" size="mini" v-if="row.auditStatus != null">
                            {{ auditStatusLabel(row.auditStatus) }}
                        </el-tag>
                        <span v-else style="color:var(--c-text-3);"></span>
                    </template>
                </el-table-column>
                <el-table-column prop="initiatorName" label="发起人" min-width="110">
                    <template slot-scope="{ row }">{{ row.initiatorName || '' }}</template>
                </el-table-column>
                <el-table-column prop="startTime" label="开始时间" min-width="170" align="center"></el-table-column>
                <el-table-column label="操作" width="100" fixed="right" align="center">
                    <template slot-scope="{ row }">
                        <el-button v-if="activeTab === 'pending'" class="matter-action" type="primary" size="mini" icon="el-icon-edit-outline" @click="openMatterPage(row)">处理</el-button>
                        <el-button v-else-if="activeTab === 'completed'" class="matter-view-action" size="mini" icon="el-icon-view" @click="openMatterPage(row)">查看</el-button>
                    </template>
                </el-table-column>
            </el-table>
            <el-table v-show="isAlertTab" ref="alertTableRef" :data="alertTableData" v-loading="alertLoading" stripe border size="small" style="width:100%;" empty-text="暂无提醒，请先在定时任务中执行「不符合主体债入库规则提醒」">
                <el-table-column label="序号" width="72" align="center">
                    <template slot-scope="{ $index }">
                        {{ (alertPagination.pageIndex - 1) * alertPagination.pageSize + $index + 1 }}
                    </template>
                </el-table-column>
                <el-table-column prop="securityCode" label="证券代码" min-width="130" show-overflow-tooltip></el-table-column>
                <el-table-column prop="securityShortName" label="证券简称" min-width="120" show-overflow-tooltip></el-table-column>
                <el-table-column prop="issuerName" label="发行主体" min-width="140" show-overflow-tooltip></el-table-column>
                <el-table-column prop="currentPoolName" label="当前分级库" min-width="130" show-overflow-tooltip></el-table-column>
                <el-table-column prop="specialTypeDesc" label="特殊类型" min-width="140" show-overflow-tooltip></el-table-column>
                <el-table-column prop="failReason" label="不符合原因" min-width="220" show-overflow-tooltip></el-table-column>
                <el-table-column label="状态" width="90" align="center">
                    <template slot-scope="{ row }">
                        <el-tag size="mini" :type="alertStatusType(row.alertStatus)">{{ alertStatusLabel(row.alertStatus) }}</el-tag>
                    </template>
                </el-table-column>
                <el-table-column prop="lastScanTime" label="扫描时间" min-width="160" align="center"></el-table-column>
                <el-table-column label="操作" width="180" fixed="right" align="center">
                    <template slot-scope="{ row }">
                        <el-button class="matter-action" type="primary" size="mini" @click="openAlertAdjust(row)">去调库</el-button>
                        <el-button v-if="row.alertStatus === '00'" size="mini" @click="handleAlertProcessed(row)">标记已处理</el-button>
                    </template>
                </el-table-column>
            </el-table>
            <div class="pagination-wrap">
                <el-pagination
                    v-if="!isAlertTab"
                    :total="pagination.total"
                    :current-page="pagination.pageIndex"
                    :page-size="pagination.pageSize"
                    :page-sizes="[10, 20, 50, 100]"
                    layout="total, sizes, prev, pager, next, jumper"
                    small
                    @current-change="handlePageChange"
                    @size-change="handleSizeChange">
                </el-pagination>
                <el-pagination
                    v-else
                    :total="alertPagination.total"
                    :current-page="alertPagination.pageIndex"
                    :page-size="alertPagination.pageSize"
                    :page-sizes="[10, 20, 50, 100]"
                    layout="total, sizes, prev, pager, next, jumper"
                    small
                    @current-change="handleAlertPageChange"
                    @size-change="handleAlertSizeChange">
                </el-pagination>
            </div>
        </div>
    </div>
</div>

<script>
new Vue({
    el: '#my_matters',
    data() {
        return {
            moment: moment, // 日期处理工具
            pagePaths: { // 页面跳转路径
                securityPoolAdjustApprove: 'security_pool_adjust_approve.html', // 证券池调整审核页
                securityPoolAdjustDetail: 'security_pool_adjust_detail.html', // 证券池调整详情页
                forbiddenPoolAdjustApprove: 'forbidden_pool_adjust_approve.html', // 禁投池调整审核页
                forbiddenPoolAdjustDetail: 'forbidden_pool_adjust_detail.html', // 禁投池调整详情页
                crmwPoolAdjustApprove: 'crmw_pool_adjust_approve.html', // CRMW池调整审核页
                crmwPoolAdjustDetail: 'crmw_pool_adjust_detail.html', // CRMW池调整详情页
                securityPoolAdjust: 'security_pool_adjust.html', // 证券池调整页（提醒去调库）
            },
            today: moment().format('YYYY年MM月DD日'), // 顶栏当前日期展示文字
            searchForm: {             // 查询条件
                flowIds: [],              // 流程 ID 多选
                securityCode: '',         // 证券编码关键词
                securityShortName: '',    // 证券名称关键词
                startDateRange: null,     // 开始日期范围
                processDescription: '',   // 流程描述关键词
                auditStatus: '',          // 审核状态
                initiatorName: '',        // 发起人姓名关键词
                currentUserId: window.RrsAuth.getCurrentUser().userId, // 当前登录用户 ID
            },
            auditStatusOptions: [     // 审核状态筛选选项
                { value: '-1', label: '无效调整' },
                { value: '00', label: '流程中' },
                { value: '11', label: '驳回待修改' },
                { value: '20', label: '审批通过' },
                { value: '21', label: '审批驳回' },
                { value: '32', label: 'O32自动审批' },
                { value: '99', label: '发起人已撤回' },
            ],
            flowOptions: [],              // 流程名称下拉选项
            activeTab: 'pending',         // 当前事宜页签：pending=待处理 / completed=已完成 / gradeRuleAlert=分级规则提醒
            tableData: [],                // 当前页审批事宜数据
            loading: false,               // 审批表格加载状态
            pagination: {             // 审批分页参数
                pageIndex: 1,             // 当前页码
                pageSize: 20,             // 每页条数
                total: 0,                 // 总记录数
            },
            alertSearchForm: {            // 分级规则提醒筛选
                securityCode: '',         // 证券代码
                alertStatus: '00',        // 待办状态，默认待处理
            },
            alertTableData: [],           // 分级规则提醒列表
            alertLoading: false,          // 提醒表格加载状态
            pendingCount: 0,              // 待处理 Tab 角标（取该 Tab 列表查询 total）
            completedCount: 0,            // 已完成 Tab 角标（取该 Tab 列表查询 total）
            alertOpenCount: 0,            // 分级规则提醒 Tab 角标（取该 Tab 列表查询 total）
            alertPagination: {            // 提醒分页
                pageIndex: 1,             // 当前页码
                pageSize: 20,             // 每页条数
                total: 0,                 // 总记录数
            },
        };
    },
    computed: {
        // 是否在分级规则提醒页签
        isAlertTab() {
            return this.activeTab === 'gradeRuleAlert';
        },
        // 右上角条数文案
        listTotalText() {
            if (this.isAlertTab) {
                return '共 ' + this.alertPagination.total + ' 条分级规则提醒';
            }
            return '共 ' + this.pagination.total + ' 条' + (this.activeTab === 'pending' ? '待处理' : '已完成') + '事宜';
        },
    },
    mounted() {
        const tab = new URLSearchParams(window.location.search).get('tab');
        if (tab === 'gradeRuleAlert') {
            this.activeTab = 'gradeRuleAlert';
        }
        this.loadFlowOptions();
        // 进入页时三个 Tab 各查一遍（当前 Tab 填列表，其余只取 total 填角标）
        this.loadAllTabsOnEnter();
        // 从审核/详情页签返回时由工作台回调，重新预载三个 Tab 角标并刷新当前列表
        window.RrsPageOnShow = () => {
            this.loadAllTabsOnEnter();
        };
        this.handleWindowResize = () => {
            window.clearTimeout(this.resizeLayoutTimer);
            this.resizeLayoutTimer = window.setTimeout(() => {
                // 窗口尺寸变化后同步所有表格固定列布局
                this.refreshAllTableLayout();
            }, 120);
        };
        window.addEventListener('resize', this.handleWindowResize);
    },
    beforeDestroy() {
        if (window.RrsPageOnShow) {
            window.RrsPageOnShow = null;
        }
        window.removeEventListener('resize', this.handleWindowResize);
        window.clearTimeout(this.resizeLayoutTimer);
    },
    methods: {
        // 审核状态码转中文
        auditStatusLabel(code) {
            const map = {
                '-1': '无效调整',
                '00': '流程中', '11': '驳回待修改',
                '20': '审批通过',
                '21': '审批驳回',
                '32': 'O32自动审批',
                '99': '发起人已撤回',
            };
            return map[String(code)] || code || '';
        },

        // 审核状态对应标签颜色
        auditStatusType(code) {
            const map = {
                '-1': 'danger',
                '00': 'warning',
                '11': 'warning',
                '20': 'success',
                '21': 'danger',
                '32': 'success',
                '99': 'info',
            };
            return map[String(code)] || 'info';
        },

        // 步骤状态码转中文
        stepStatusLabel(code) {
            const map = {
                pending: '待处理',
                approve: '通过',
                reject: '驳回',
                submit: '提交',
                auto_process: '自动处理',
                canceled: '已撤回',
            };
            return map[String(code)] || code || '';
        },

        // 分级规则提醒状态文案
        alertStatusLabel(code) {
            const map = { '00': '待处理', '20': '已处理', '99': '已失效' };
            return map[String(code)] || code || '';
        },

        // 分级规则提醒状态颜色
        alertStatusType(code) {
            const map = { '00': 'warning', '20': 'success', '99': 'info' };
            return map[String(code)] || 'info';
        },

        // 步骤状态对应标签颜色
        stepStatusType(code) {
            const map = {
                pending: 'warning',
                approve: 'success',
                reject: 'danger',
                submit: 'primary',
                auto_process: 'info',
                canceled: 'info',
            };
            return map[String(code)] || 'info';
        },

        // 加载流程名称下拉选项
        async loadFlowOptions() {
            try {
                this.flowOptions = await this.apiPost('/api/v1/myMatters/queryFlowOptionList', {
                    currentUserId: this.searchForm.currentUserId,
                });
            } catch (e) {}
        },

        // 按当前页签加载审批或提醒
        reloadCurrentTab() {
            if (this.isAlertTab) {
                this.loadAlertList();
            } else {
                this.loadList();
            }
        },

        // 进入页面：三个 Tab 并行各查一次；当前 Tab 加载列表，其余只取 total
        async loadAllTabsOnEnter() {
            const tasks = [];
            if (this.activeTab === 'pending') {
                tasks.push(this.loadList());
            } else {
                tasks.push(this.queryMatterTabTotal('pending'));
            }
            if (this.activeTab === 'completed') {
                tasks.push(this.loadList());
            } else {
                tasks.push(this.queryMatterTabTotal('completed'));
            }
            if (this.isAlertTab) {
                tasks.push(this.loadAlertList());
            } else {
                tasks.push(this.queryAlertTabTotal());
            }
            await Promise.all(tasks);
        },

        // 仅查询事宜 Tab 的 total（进入页预载角标用）
        async queryMatterTabTotal(stepStatus) {
            try {
                const data = await this.apiPost('/api/v1/myMatters/queryMyMattersPage', {
                    flowIds: this.searchForm.flowIds.length > 0 ? this.searchForm.flowIds : null,
                    securityCode: this.searchForm.securityCode || null,
                    securityShortName: this.searchForm.securityShortName || null,
                    startDateStart: this.searchForm.startDateRange ? this.searchForm.startDateRange[0] : null,
                    startDateEnd: this.searchForm.startDateRange ? this.searchForm.startDateRange[1] : null,
                    processDescription: this.searchForm.processDescription || null,
                    auditStatus: this.searchForm.auditStatus || null,
                    stepStatus: stepStatus,
                    initiatorName: this.searchForm.initiatorName || null,
                    currentUserId: this.searchForm.currentUserId,
                    pageIndex: 1,
                    pageSize: 1,
                });
                const total = data && data.total != null ? Number(data.total) : 0;
                if (stepStatus === 'pending') {
                    this.pendingCount = total;
                } else {
                    this.completedCount = total;
                }
            } catch (e) {
                if (stepStatus === 'pending') {
                    this.pendingCount = 0;
                } else {
                    this.completedCount = 0;
                }
            }
        },

        // 仅查询分级规则提醒 Tab 的 total（进入页预载角标用）
        async queryAlertTabTotal() {
            try {
                const data = await this.apiPost('/api/v1/gradeRuleAlert/queryAlertPage', {
                    securityCode: this.alertSearchForm.securityCode || null,
                    alertStatus: this.alertSearchForm.alertStatus || null,
                    pageIndex: 1,
                    pageSize: 1,
                });
                this.alertOpenCount = data && data.total != null ? Number(data.total) : 0;
            } catch (e) {
                this.alertOpenCount = 0;
            }
        },

        // 加载我的事宜列表
        async loadList() {
            this.loading = true;
            try {
                const params = {
                    flowIds: this.searchForm.flowIds.length > 0 ? this.searchForm.flowIds : null,
                    securityCode: this.searchForm.securityCode || null,
                    securityShortName: this.searchForm.securityShortName || null,
                    startDateStart: this.searchForm.startDateRange ? this.searchForm.startDateRange[0] : null,
                    startDateEnd: this.searchForm.startDateRange ? this.searchForm.startDateRange[1] : null,
                    processDescription: this.searchForm.processDescription || null,
                    auditStatus: this.searchForm.auditStatus || null,
                    stepStatus: this.activeTab,
                    initiatorName: this.searchForm.initiatorName || null,
                    currentUserId: this.searchForm.currentUserId,
                    pageIndex: this.pagination.pageIndex,
                    pageSize: this.pagination.pageSize,
                };
                const data = await this.apiPost('/api/v1/myMatters/queryMyMattersPage', params);
                this.tableData = data.records || [];
                this.pagination.total = data.total != null ? Number(data.total) : 0;
                // Tab 角标直接用本次查询 total
                if (this.activeTab === 'pending') {
                    this.pendingCount = this.pagination.total;
                } else if (this.activeTab === 'completed') {
                    this.completedCount = this.pagination.total;
                }
            } catch (e) {}
            this.loading = false;
            // 数据渲染后同步列表固定列布局
            this.refreshTableLayout('mattersTableRef');
        },

        // 重新计算指定表格固定列布局（数据渲染后 $nextTick + doLayout）
        refreshTableLayout(refName) {
            this.$nextTick(() => {
                const table = this.$refs[refName];
                if (table && typeof table.doLayout === 'function') {
                    table.doLayout();
                }
            });
        },

        // 重新计算当前页面所有表格固定列布局
        refreshAllTableLayout() {
            this.$nextTick(() => {
                Object.keys(this.$refs || {}).forEach(refName => {
                    const ref = this.$refs[refName];
                    const table = Array.isArray(ref) ? ref[0] : ref;
                    if (table && typeof table.doLayout === 'function') {
                        table.doLayout();
                    }
                });
            });
        },

        // 加载分级规则提醒列表（后端 gradeRuleAlert 接口不变）
        async loadAlertList() {
            this.alertLoading = true;
            try {
                const data = await this.apiPost('/api/v1/gradeRuleAlert/queryAlertPage', {
                    securityCode: this.alertSearchForm.securityCode || null,
                    alertStatus: this.alertSearchForm.alertStatus || null,
                    pageIndex: this.alertPagination.pageIndex,
                    pageSize: this.alertPagination.pageSize,
                });
                this.alertTableData = (data && data.records) ? data.records : [];
                this.alertPagination.total = data && data.total != null ? Number(data.total) : 0;
                // Tab 角标直接用本次查询 total
                this.alertOpenCount = this.alertPagination.total;
            } catch (e) {
                this.$message.error((e && e.message) || '查询失败');
                this.alertTableData = [];
                this.alertPagination.total = 0;
                this.alertOpenCount = 0;
            }
            this.alertLoading = false;
            this.refreshTableLayout('alertTableRef');
        },

        // 触发查询
        handleSearch() {
            if (this.isAlertTab) {
                this.alertPagination.pageIndex = 1;
                this.loadAlertList();
            } else {
                this.pagination.pageIndex = 1;
                this.loadList();
            }
        },

        // 切换事宜页签
        handleTabClick() {
            if (this.isAlertTab) {
                this.alertPagination.pageIndex = 1;
                this.loadAlertList();
            } else {
                this.pagination.pageIndex = 1;
                this.loadList();
            }
        },

        // 重置查询条件
        handleReset() {
            if (this.isAlertTab) {
                this.alertSearchForm = {
                    securityCode: '',
                    alertStatus: '00',
                };
                this.alertPagination.pageIndex = 1;
                this.loadAlertList();
                return;
            }
            this.searchForm = {
                flowIds: [],
                securityCode: '',
                securityShortName: '',
                startDateRange: null,
                processDescription: '',
                auditStatus: '',
                initiatorName: '',
                currentUserId: window.RrsAuth.getCurrentUser().userId,
            };
            this.pagination.pageIndex = 1;
            this.loadFlowOptions();
            this.loadList();
        },

        // 翻页
        handlePageChange(page) {
            this.pagination.pageIndex = page;
            this.loadList();
        },

        // 切换每页条数
        handleSizeChange(size) {
            this.pagination.pageSize = size;
            this.pagination.pageIndex = 1;
            this.loadList();
        },

        // 提醒列表翻页
        handleAlertPageChange(page) {
            this.alertPagination.pageIndex = page;
            this.loadAlertList();
        },

        // 提醒列表切换每页条数
        handleAlertSizeChange(size) {
            this.alertPagination.pageSize = size;
            this.alertPagination.pageIndex = 1;
            this.loadAlertList();
        },

        // 从提醒跳转证券池调库（工作台内新开调库页签）
        openAlertAdjust(row) {
            const code = row.securityCode || '';
            const name = row.securityShortName || code;
            const params = new URLSearchParams();
            if (code) params.set('securityCode', code);
            const opened = window.RrsWorkbench.openDetailTab({
                index: window.RrsWorkbench.buildTabIndex('security-adjust', [code]),
                title: window.RrsWorkbench.formatDetailTitle(name, code, '调库'),
                page: this.pagePaths.securityPoolAdjust,
                query: params.toString(),
            });
            if (opened) return;
            window.RrsAuth.appendUserParams(params);
            window.location.href = this.pagePaths.securityPoolAdjust + '?' + params.toString();
        },

        // 标记提醒已处理，不改池
        async handleAlertProcessed(row) {
            try {
                await this.$confirm('确认将本条标记为已处理？不会自动改池，请先在证券池调库完成下调或出库。', '提示', {
                    type: 'warning',
                    confirmButtonText: '确定',
                    cancelButtonText: '取消',
                });
            } catch (e) {
                return;
            }
            this.alertLoading = true;
            try {
                const loginUser = window.RrsAuth.getCurrentUser();
                await this.apiPost('/api/v1/gradeRuleAlert/editAlertProcessed', {
                    id: row.id,
                    currentUserId: loginUser && loginUser.userId,
                    currentUserName: loginUser && loginUser.userName,
                });
                this.$message.success('已标记处理');
                this.loadAlertList();
            } catch (e) {
                this.alertLoading = false;
                this.$message.error((e && e.message) || '处理失败');
            }
        },

        // 打开对应审核/详情页（工作台内按记录新开页签，同键复用）
        openMatterPage(row) {
            const params = new URLSearchParams();
            const isForbiddenCompanyAdjust = row.businessScene === 'forbiddenCompanyAdjust';
            const isCrmwAdjust = row.businessScene === 'crmwAdjust';
            const isPending = this.activeTab === 'pending';
            const code = row.securityCode || '';
            const name = row.securityShortName || code;
            if (code) {
                params.set(isForbiddenCompanyAdjust ? 'companyCode' : 'securityCode', code);
            }
            if (isCrmwAdjust && row.crmwScode) params.set('crmwScode', row.crmwScode);
            if (row.targetPoolId) params.set('targetPoolId', row.targetPoolId);
            if (row.adjustLogId) params.set('adjustLogId', row.adjustLogId);
            if (row.adjustBatchNo) params.set('adjustBatchNo', row.adjustBatchNo);
            params.set('entryMode', isPending ? 'process' : 'view');
            let page = isPending
                ? this.pagePaths.securityPoolAdjustApprove
                : this.pagePaths.securityPoolAdjustDetail;
            let prefix = isPending ? 'security-approve' : 'security-detail';
            if (isForbiddenCompanyAdjust) {
                page = isPending
                    ? this.pagePaths.forbiddenPoolAdjustApprove
                    : this.pagePaths.forbiddenPoolAdjustDetail;
                prefix = isPending ? 'forbidden-approve' : 'forbidden-detail';
            } else if (isCrmwAdjust) {
                page = isPending
                    ? this.pagePaths.crmwPoolAdjustApprove
                    : this.pagePaths.crmwPoolAdjustDetail;
                prefix = isPending ? 'crmw-approve' : 'crmw-detail';
            }
            const opened = window.RrsWorkbench.openDetailTab({
                index: window.RrsWorkbench.buildTabIndex(prefix, [
                    isCrmwAdjust ? row.crmwScode : code,
                    code,
                    row.adjustLogId,
                    row.adjustBatchNo,
                    row.targetPoolId,
                ]),
                title: window.RrsWorkbench.formatDetailTitle(name, code, isPending ? '审核' : '详情'),
                page: page,
                query: params.toString(),
            });
            if (opened) return;
            window.RrsAuth.appendUserParams(params);
            window.location.href = page + '?' + params.toString();
        },
    }
});
</script>
</body>
</html>
