<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的事宜</title>
    <link rel="stylesheet" href="https://unpkg.com/element-ui@2.15.14/lib/theme-chalk/index.css">
    <script src="https://unpkg.com/vue@2.5.16/dist/vue.min.js"></script>
    <script src="https://unpkg.com/element-ui@2.15.14/lib/index.js"></script>
    <script src="https://unpkg.com/axios@1.7.9/dist/axios.min.js"></script>
    <script src="../js/api.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.30.1/moment.min.js"></script>
    <link rel="stylesheet" href="../css/my_matters.css">
    <link rel="stylesheet" href="../css/common.css">
</head>
<body class="my-matters-page">
<div id="my_matters">
    <!-- ── 顶栏 ── -->
    <div class="topbar">
        <div class="topbar-brand">
            <div class="topbar-icon">
                <svg width="18" height="18" viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-9 14l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>
            </div>
            <h2>我的事宜</h2>
        </div>
        <div class="topbar-sep"></div>
        <span class="topbar-sys">证券投资管理系统</span>
        <div class="topbar-meta">
            <span class="topbar-date-badge">{{ today }}</span>
        </div>
    </div>

    <!-- ── 列表页 ── -->
    <div class="list-body" v-loading="businessLoading">
        <el-tabs v-model="businessDomain" @tab-click="handleBusinessChange">
            <el-tab-pane v-for="domain in businessDomains" :key="domain.businessDomain" :name="domain.businessDomain" :label="businessDomainLabel(domain.businessDomain)"></el-tab-pane>
        </el-tabs>
        <el-empty v-if="businessReady && !businessDomain" description="暂无可用的业务入口，请联系管理员配置入口显示规则"></el-empty>
        <template v-if="businessDomain">
        <!-- 搜索面板 -->
        <div class="search-panel">
            <div class="search-row">
                <span class="search-label"><i class="el-icon-search"></i>筛选</span>

                <template v-if="!isAlertTab">
                    <el-select v-model="searchForm.flowIds" placeholder="流程名称" clearable multiple collapse-tags size="small" style="width:220px;">
                        <el-option v-for="f in flowOptions" :key="f.flowId" :label="f.flowName" :value="f.flowId"></el-option>
                    </el-select>

                    <el-input v-model.trim="searchForm.securityCode" :placeholder="objectCodeLabel" clearable size="small" style="width:140px;" @keyup.enter.native="handleSearch">
                        <i slot="prefix" class="el-input__icon el-icon-document"></i>
                    </el-input>

                    <el-input v-model.trim="searchForm.securityShortName" :placeholder="objectNameLabel" clearable size="small" style="width:140px;" @keyup.enter.native="handleSearch">
                        <i slot="prefix" class="el-input__icon el-icon-tickets"></i>
                    </el-input>

                    <el-date-picker
                        v-model="searchForm.startDateRange"
                        type="daterange"
                        popper-class="project-date-range-picker"
                        range-separator="至"
                        start-placeholder="开始日期"
                        end-placeholder="结束日期"
                        size="small"
                        style="width:240px;"
                        value-format="yyyy-MM-dd">
                    </el-date-picker>

                    <el-input v-model.trim="searchForm.processDescription" placeholder="流程描述" clearable size="small" style="width:220px;" @keyup.enter.native="handleSearch">
                        <i slot="prefix" class="el-input__icon el-icon-document"></i>
                    </el-input>

                    <el-input v-if="activeTab !== 'initiated'" v-model.trim="searchForm.initiatorName" placeholder="发起人" clearable size="small" style="width:140px;" @keyup.enter.native="handleSearch">
                        <i slot="prefix" class="el-input__icon el-icon-user"></i>
                    </el-input>

                    <el-select v-model="searchForm.auditStatus" placeholder="审核状态" clearable size="small" style="width:130px;">
                        <el-option v-for="a in auditStatusOptions" :key="a.value" :label="a.label" :value="a.value"></el-option>
                    </el-select>
                </template>
                <template v-else>
                    <el-input v-model.trim="alertSearchForm.securityCode" placeholder="证券代码" clearable size="small" style="width:180px;" @keyup.enter.native="handleSearch">
                        <i slot="prefix" class="el-input__icon el-icon-document"></i>
                    </el-input>
                    <el-select v-model="alertSearchForm.alertStatus" placeholder="状态" clearable size="small" style="width:140px;">
                        <el-option label="待处理" value="00"></el-option>
                        <el-option label="已处理" value="20"></el-option>
                        <el-option label="已失效" value="99"></el-option>
                    </el-select>
                </template>

                <el-button type="primary" size="small" icon="el-icon-search" @click="handleSearch">查询</el-button>
                <el-button size="small" icon="el-icon-refresh" @click="handleReset">重置</el-button>

                <div class="total-badge">
                    <i class="el-icon-data-line"></i> {{ listTotalText }}
                </div>
            </div>
        </div>

        <!-- 事宜列表：待处理 / 已完成 / 我发起的 / 分级规则提醒 -->
        <div class="table-card">
            <el-tabs v-model="activeTab" @tab-click="handleTabClick">
                <el-tab-pane name="pending">
                    <span slot="label">待处理 ({{ pendingCount }})</span>
                </el-tab-pane>
                <el-tab-pane name="completed">
                    <span slot="label">已完成 ({{ completedCount }})</span>
                </el-tab-pane>
                <el-tab-pane name="initiated">
                    <span slot="label">我发起的 ({{ initiatedCount }})</span>
                </el-tab-pane>
                <el-tab-pane v-if="businessDomain === 'bond'" name="gradeRuleAlert">
                    <span slot="label">分级规则提醒 ({{ alertOpenCount }})</span>
                </el-tab-pane>
            </el-tabs>
            <el-table v-show="!isAlertTab" ref="mattersTableRef" :data="tableData" v-loading="loading" stripe border size="small" style="width:100%;" empty-text="暂无事宜">
                <el-table-column label="序号" width="72" align="center">
                    <template slot-scope="{ $index }">
                        {{ (pagination.pageIndex - 1) * pagination.pageSize + $index + 1 }}
                    </template>
                </el-table-column>
                <el-table-column prop="flowName" label="流程名称" min-width="160" show-overflow-tooltip></el-table-column>
                <el-table-column prop="stepName" label="步骤名称" min-width="140" show-overflow-tooltip></el-table-column>
                <el-table-column prop="objectCode" :label="objectCodeLabel" min-width="130" show-overflow-tooltip></el-table-column>
                <el-table-column prop="objectName" :label="objectNameLabel" min-width="150" show-overflow-tooltip></el-table-column>
                <el-table-column label="流程描述" min-width="300" show-overflow-tooltip>
                    <template slot-scope="{ row }">
                        <span class="desc-link" @click="openMatterPage(row)">{{ row.processDescription || '' }}</span>
                    </template>
                </el-table-column>
                <el-table-column label="步骤状态" min-width="110">
                    <template slot-scope="{ row }">
                        <el-tag :type="stepStatusType(row.stepStatus)" size="mini" v-if="row.stepStatus != null">
                            {{ stepStatusLabel(row.stepStatus) }}
                        </el-tag>
                        <span v-else style="color:var(--c-text-3);"></span>
                    </template>
                </el-table-column>
                <el-table-column label="审核状态" min-width="110">
                    <template slot-scope="{ row }">
                        <el-tag :type="auditStatusType(row.auditStatus)" size="mini" v-if="row.auditStatus != null">
                            {{ auditStatusLabel(row.auditStatus) }}
                        </el-tag>
                        <span v-else style="color:var(--c-text-3);"></span>
                    </template>
                </el-table-column>
                <el-table-column prop="initiatorName" label="发起人" min-width="110">
                    <template slot-scope="{ row }">{{ row.initiatorName || '' }}</template>
                </el-table-column>
                <el-table-column prop="startTime" label="开始时间" min-width="170" align="center"></el-table-column>
                <el-table-column label="操作" width="100" fixed="right" align="center">
                    <template slot-scope="{ row }">
                        <el-button v-if="activeTab === 'pending'" class="matter-action" type="primary" size="mini" icon="el-icon-edit-outline" @click="openMatterPage(row)">处理</el-button>
                        <el-button v-else-if="activeTab === 'completed' || activeTab === 'initiated'" class="matter-view-action" size="mini" icon="el-icon-view" @click="openMatterPage(row)">查看</el-button>
                    </template>
                </el-table-column>
            </el-table>
            <el-table v-show="isAlertTab" ref="alertTableRef" :data="alertTableData" v-loading="alertLoading" stripe border size="small" style="width:100%;" empty-text="暂无提醒，请先在定时任务中执行「不符合主体债入库规则提醒」">
                <el-table-column label="序号" width="72" align="center">
                    <template slot-scope="{ $index }">
                        {{ (alertPagination.pageIndex - 1) * alertPagination.pageSize + $index + 1 }}
                    </template>
                </el-table-column>
                <el-table-column prop="securityCode" label="证券代码" min-width="130" show-overflow-tooltip></el-table-column>
                <el-table-column prop="securityShortName" label="证券简称" min-width="120" show-overflow-tooltip></el-table-column>
                <el-table-column prop="issuerName" label="发行主体" min-width="140" show-overflow-tooltip></el-table-column>
                <el-table-column prop="currentPoolName" label="当前分级库" min-width="130" show-overflow-tooltip></el-table-column>
                <el-table-column prop="specialTypeDesc" label="特殊类型" min-width="140" show-overflow-tooltip></el-table-column>
                <el-table-column prop="failReason" label="不符合原因" min-width="220" show-overflow-tooltip></el-table-column>
                <el-table-column label="状态" width="90" align="center">
                    <template slot-scope="{ row }">
                        <el-tag size="mini" :type="alertStatusType(row.alertStatus)">{{ alertStatusLabel(row.alertStatus) }}</el-tag>
                    </template>
                </el-table-column>
                <el-table-column prop="lastScanTime" label="扫描时间" min-width="160" align="center"></el-table-column>
                <el-table-column label="操作" width="180" fixed="right" align="center">
                    <template slot-scope="{ row }">
                        <el-button class="matter-action" type="primary" size="mini" @click="openAlertAdjust(row)">去调库</el-button>
                        <el-button v-if="row.alertStatus === '00'" size="mini" @click="handleAlertProcessed(row)">标记已处理</el-button>
                    </template>
                </el-table-column>
            </el-table>
            <div class="pagination-wrap">
                <el-pagination
                    v-if="!isAlertTab"
                    :total="pagination.total"
                    :current-page="pagination.pageIndex"
                    :page-size="pagination.pageSize"
                    :page-sizes="[10, 20, 50, 100]"
                    layout="total, sizes, prev, pager, next, jumper"
                    small
                    @current-change="handlePageChange"
                    @size-change="handleSizeChange">
                </el-pagination>
                <el-pagination
                    v-else
                    :total="alertPagination.total"
                    :current-page="alertPagination.pageIndex"
                    :page-size="alertPagination.pageSize"
                    :page-sizes="[10, 20, 50, 100]"
                    layout="total, sizes, prev, pager, next, jumper"
                    small
                    @current-change="handleAlertPageChange"
                    @size-change="handleAlertSizeChange">
                </el-pagination>
            </div>
        </div>
        </template>
    </div>
</div>

<script>
new Vue({
    el: '#my_matters',
    data() {
        return {
            businessDomains: [], // 后端计算的可展示业务入口
            businessDomain: '', // 当前选中的业务
            businessLoading: false, // 业务入口加载状态
            businessReady: false, // 业务入口初始化是否完成
            viewRevision: 0, // 业务、筛选、页签变化时递增，忽略旧响应
            listRequestId: 0, // 同视图并发列表查询序号
            alertRequestId: 0, // 提醒查询序号
            flowRequestId: 0, // 流程下拉查询序号
            matterRoutes: { // 各场景独立页面及定位参数
                securityAdjust: { domain: 'bond', codeParam: 'securityCode', approve: 'security_pool_adjust_approve.html', detail: 'security_pool_adjust_detail.html' },
                forbiddenCompanyAdjust: { domain: 'bond', codeParam: 'companyCode', approve: 'forbidden_pool_adjust_approve.html', detail: 'forbidden_pool_adjust_detail.html' },
                crmwAdjust: { domain: 'bond', codeParam: 'securityCode', approve: 'crmw_pool_adjust_approve.html', detail: 'crmw_pool_adjust_detail.html' },
                fundAdjust: { domain: 'fund', codeParam: 'fundCode', approve: 'fund_pool_adjust_approve.html', detail: 'fund_pool_adjust_detail.html' },
            },
            moment: moment, // 日期处理工具
            pagePaths: { // 页面跳转路径
                securityPoolAdjustApprove: 'security_pool_adjust_approve.html', // 证券池调整审核页
                securityPoolAdjustDetail: 'security_pool_adjust_detail.html', // 证券池调整详情页
                forbiddenPoolAdjustApprove: 'forbidden_pool_adjust_approve.html', // 禁投池调整审核页
                forbiddenPoolAdjustDetail: 'forbidden_pool_adjust_detail.html', // 禁投池调整详情页
                crmwPoolAdjustApprove: 'crmw_pool_adjust_approve.html', // CRMW池调整审核页
                crmwPoolAdjustDetail: 'crmw_pool_adjust_detail.html', // CRMW池调整详情页
                securityPoolAdjust: 'security_pool_adjust.html', // 证券池调整页（提醒去调库）
            },
            today: moment().format('YYYY年MM月DD日'), // 顶栏当前日期展示文字
            currentUserId: window.RrsAuth.getCurrentUser().userId, // 当前登录用户 ID
            currentUserName: window.RrsAuth.getCurrentUser().userName, // 当前登录用户名称
            searchForm: {             // 查询条件
                flowIds: [],              // 流程 ID 多选
                securityCode: '',         // 证券编码关键词
                securityShortName: '',    // 证券名称关键词
                startDateRange: null,     // 开始日期范围
                processDescription: '',   // 流程描述关键词
                auditStatus: '',          // 审核状态
                initiatorName: '',        // 发起人姓名关键词
            },
            auditStatusOptions: [     // 审核状态筛选选项
                { value: '-1', label: '无效调整' },
                { value: '00', label: '流程中' },
                { value: '11', label: '驳回待修改' },
                { value: '20', label: '审批通过' },
                { value: '21', label: '审批驳回' },
                { value: '32', label: 'O32自动审批' },
                { value: '99', label: '发起人已撤回' },
            ],
            flowOptions: [],              // 流程名称下拉选项
            activeTab: 'pending',         // 当前事宜页签：pending=待处理 / completed=已完成 / initiated=我发起的 / gradeRuleAlert=分级规则提醒
            tableData: [],                // 当前页审批事宜数据
            loading: false,               // 审批表格加载状态
            pagination: {             // 审批分页参数
                pageIndex: 1,             // 当前页码
                pageSize: 20,             // 每页条数
                total: 0,                 // 总记录数
            },
            alertSearchForm: {            // 分级规则提醒筛选
                securityCode: '',         // 证券代码
                alertStatus: '00',        // 待办状态，默认待处理
            },
            alertTableData: [],           // 分级规则提醒列表
            alertLoading: false,          // 提醒表格加载状态
            pendingCount: 0,              // 待处理 Tab 角标（取该 Tab 列表查询 total）
            completedCount: 0,            // 已完成 Tab 角标（取该 Tab 列表查询 total）
            initiatedCount: 0,            // 我发起的 Tab 角标（取该 Tab 列表查询 total）
            alertOpenCount: 0,            // 分级规则提醒 Tab 角标（取该 Tab 列表查询 total）
            alertPagination: {            // 提醒分页
                pageIndex: 1,             // 当前页码
                pageSize: 20,             // 每页条数
                total: 0,                 // 总记录数
            },
        };
    },
    computed: {
        // 当前业务的代码筛选与列表文案
        objectCodeLabel() { return this.businessDomain === 'fund' ? '基金代码' : '证券编码'; },
        // 当前业务的名称筛选与列表文案
        objectNameLabel() { return this.businessDomain === 'fund' ? '基金名称' : '证券名称'; },
        // 是否在分级规则提醒页签
        isAlertTab() {
            return this.activeTab === 'gradeRuleAlert';
        },
        // 右上角条数文案
        listTotalText() {
            if (this.isAlertTab) {
                return '共 ' + this.alertPagination.total + ' 条分级规则提醒';
            }
            const tabLabelMap = {
                pending: '待处理',
                completed: '已完成',
                initiated: '我发起的',
            };
            return '共 ' + this.pagination.total + ' 条' + (tabLabelMap[this.activeTab] || '') + '事宜';
        },
    },
    mounted() {
        const tab = new URLSearchParams(window.location.search).get('tab');
        if (tab === 'gradeRuleAlert' || tab === 'initiated') {
            this.activeTab = tab;
        }
        // 页面实例初始化时读取一次业务入口，再加载当前业务事项
        this.loadBusinessDomains();
        // 从审核/详情页签返回时，仅刷新当前业务的流程、列表和角标
        window.RrsPageOnShow = async () => {
            if (!this.businessReady || !this.businessDomain) return;
            this.viewRevision++;
            await Promise.all([this.loadFlowOptions(), this.loadAllTabsOnEnter()]);
        };
        this.handleWindowResize = () => {
            window.clearTimeout(this.resizeLayoutTimer);
            this.resizeLayoutTimer = window.setTimeout(() => {
                // 窗口尺寸变化后同步所有表格固定列布局
                this.refreshAllTableLayout();
            }, 120);
        };
        window.addEventListener('resize', this.handleWindowResize);
    },
    beforeDestroy() {
        if (window.RrsPageOnShow) {
            window.RrsPageOnShow = null;
        }
        window.removeEventListener('resize', this.handleWindowResize);
        window.clearTimeout(this.resizeLayoutTimer);
    },
    methods: {
        // 审核状态码转中文
        auditStatusLabel(code) {
            const map = {
                '-1': '无效调整',
                '00': '流程中', '11': '驳回待修改',
                '20': '审批通过',
                '21': '审批驳回',
                '32': 'O32自动审批',
                '99': '发起人已撤回',
            };
            return map[String(code)] || code || '';
        },

        // 审核状态对应标签颜色
        auditStatusType(code) {
            const map = {
                '-1': 'danger',
                '00': 'warning',
                '11': 'warning',
                '20': 'success',
                '21': 'danger',
                '32': 'success',
                '99': 'info',
            };
            return map[String(code)] || 'info';
        },

        // 步骤状态码转中文
        stepStatusLabel(code) {
            const map = {
                pending: '待处理',
                approve: '通过',
                reject: '驳回',
                submit: '提交',
                auto_process: '自动处理',
                canceled: '已撤回',
            };
            return map[String(code)] || code || '';
        },

        // 分级规则提醒状态文案
        alertStatusLabel(code) {
            const map = { '00': '待处理', '20': '已处理', '99': '已失效' };
            return map[String(code)] || code || '';
        },

        // 分级规则提醒状态颜色
        alertStatusType(code) {
            const map = { '00': 'warning', '20': 'success', '99': 'info' };
            return map[String(code)] || 'info';
        },

        // 步骤状态对应标签颜色
        stepStatusType(code) {
            const map = {
                pending: 'warning',
                approve: 'success',
                reject: 'danger',
                submit: 'primary',
                auto_process: 'info',
                canceled: 'info',
            };
            return map[String(code)] || 'info';
        },

        // 业务编码展示名称
        businessDomainLabel(code) {
            const labels = { bond: '债券', fund: '基金', stock: '股票' };
            return labels[code] || code;
        },

        // 当前页面实例只初始化一次业务入口，刷新 iframe 后由新实例重新查询
        async loadBusinessDomains() {
            if (this.businessReady || this.businessLoading) return;
            this.businessLoading = true;
            try {
                const domains = await this.apiPost('/api/v1/myMatters/queryBusinessDomainList', { currentUserId: this.currentUserId });
                this.businessDomains = domains;
                this.businessDomain = domains.length ? domains[0].businessDomain : '';
                this.resetBusinessView();
                if (this.activeTab === 'gradeRuleAlert' && this.businessDomain !== 'bond') this.activeTab = 'pending';
                if (this.businessDomain) await Promise.all([this.loadFlowOptions(), this.loadAllTabsOnEnter()]);
            } catch (e) {
                this.businessDomains = [];
                this.businessDomain = '';
                this.resetBusinessView();
            } finally {
                this.businessLoading = false;
                this.businessReady = true;
            }
        },

        // 切换业务，重置筛选、分页、角标及旧请求版本
        async handleBusinessChange() {
            this.resetBusinessView();
            this.activeTab = 'pending';
            await Promise.all([this.loadFlowOptions(), this.loadAllTabsOnEnter()]);
        },

        // 清空当前业务视图
        resetBusinessView() {
            this.viewRevision++;
            this.searchForm = { flowIds: [], securityCode: '', securityShortName: '', startDateRange: null, processDescription: '', auditStatus: '', initiatorName: '' };
            this.alertSearchForm = { securityCode: '', alertStatus: '00' };
            this.pagination = { pageIndex: 1, pageSize: 20, total: 0 };
            this.alertPagination = { pageIndex: 1, pageSize: 20, total: 0 };
            this.tableData = []; this.alertTableData = []; this.flowOptions = [];
            this.pendingCount = 0; this.completedCount = 0; this.initiatedCount = 0; this.alertOpenCount = 0;
            this.loading = false; this.alertLoading = false;
        },

        // 生成当前请求的视图快照
        captureView() { return { domain: this.businessDomain, revision: this.viewRevision, tab: this.activeTab }; },

        // 判断响应是否仍属于当前业务与筛选版本
        isCurrentView(view) { return view.domain === this.businessDomain && view.revision === this.viewRevision; },

        // 当前业务审批查询参数；字段按摘要语义使用，各 Mapper 独立映射到领域列
        buildMatterQuery(stepStatus, totalOnly = false) {
            return {
                businessDomain: this.businessDomain,
                currentUserId: this.currentUserId,
                flowIds: this.searchForm.flowIds.length ? this.searchForm.flowIds : null,
                securityCode: this.searchForm.securityCode || null,
                securityShortName: this.searchForm.securityShortName || null,
                startDateStart: this.searchForm.startDateRange ? this.searchForm.startDateRange[0] : null,
                startDateEnd: this.searchForm.startDateRange ? this.searchForm.startDateRange[1] : null,
                processDescription: this.searchForm.processDescription || null,
                auditStatus: this.searchForm.auditStatus || null,
                initiatorName: stepStatus ? this.searchForm.initiatorName || null : null,
                stepStatus: stepStatus || null,
                pageIndex: totalOnly ? 1 : this.pagination.pageIndex,
                pageSize: totalOnly ? 1 : this.pagination.pageSize,
            };
        },

        // 加载流程名称下拉选项
        async loadFlowOptions() {
            if (!this.businessDomain) return;
            const view = this.captureView();
            const requestId = ++this.flowRequestId;
            try {
                const options = await this.apiPost('/api/v1/myMatters/queryFlowOptionList', { businessDomain: view.domain, currentUserId: this.currentUserId });
                if (this.isCurrentView(view) && requestId === this.flowRequestId) this.flowOptions = options;
            } catch (e) {
                if (this.isCurrentView(view) && requestId === this.flowRequestId) this.flowOptions = [];
            }
        },

        // 按当前页签加载审批或提醒
        reloadCurrentTab() {
            if (this.isAlertTab) {
                this.loadAlertList();
            } else if (this.activeTab === 'initiated') {
                this.loadInitiatedList();
            } else {
                this.loadList();
            }
        },

        // 进入页面：各事宜 Tab 并行各查一次；当前 Tab 加载列表，其余只取 total
        async loadAllTabsOnEnter() {
            if (!this.businessDomain) return;
            const tasks = [];
            for (const tab of ['pending', 'completed', 'initiated']) {
                if (this.activeTab === tab) tasks.push(tab === 'initiated' ? this.loadInitiatedList() : this.loadList());
                else tasks.push(tab === 'initiated' ? this.queryInitiatedTabTotal() : this.queryMatterTabTotal(tab));
            }
            if (this.businessDomain === 'bond') tasks.push(this.isAlertTab ? this.loadAlertList() : this.queryAlertTabTotal());
            await Promise.all(tasks);
        },

        // 仅查询待处理 / 已完成 Tab 的 total（进入页预载角标用）
        async queryMatterTabTotal(stepStatus) {
            const view = this.captureView();
            try {
                const data = await this.apiPost('/api/v1/myMatters/queryMyMattersPage', this.buildMatterQuery(stepStatus, true));
                if (!this.isCurrentView(view)) return;
                this[stepStatus === 'pending' ? 'pendingCount' : 'completedCount'] = Number(data.total || 0);
            } catch (e) {
                if (this.isCurrentView(view)) this[stepStatus === 'pending' ? 'pendingCount' : 'completedCount'] = 0;
            }
        },

        // 仅查询「我发起的」Tab 的 total（独立接口）
        async queryInitiatedTabTotal() {
            const view = this.captureView();
            try {
                const data = await this.apiPost('/api/v1/myMatters/queryMyInitiatedMattersPage', this.buildMatterQuery(null, true));
                if (this.isCurrentView(view)) this.initiatedCount = Number(data.total || 0);
            } catch (e) {
                if (this.isCurrentView(view)) this.initiatedCount = 0;
            }
        },

        // 仅查询分级规则提醒 Tab 的 total（进入页预载角标用）
        async queryAlertTabTotal() {
            if (this.businessDomain !== 'bond') return;
            const view = this.captureView();
            try {
                const data = await this.apiPost('/api/v1/gradeRuleAlert/queryAlertPage', {
                    currentUserId: this.currentUserId, securityCode: this.alertSearchForm.securityCode || null,
                    alertStatus: this.alertSearchForm.alertStatus || null, pageIndex: 1, pageSize: 1,
                });
                if (this.isCurrentView(view)) this.alertOpenCount = Number(data.total || 0);
            } catch (e) {
                if (this.isCurrentView(view)) this.alertOpenCount = 0;
            }
        },

        // 加载待处理 / 已完成列表
        async loadList() {
            await this.loadMatterList(this.activeTab);
        },

        // 加载「我发起的」列表（独立接口）
        async loadInitiatedList() {
            await this.loadMatterList('initiated');
        },

        // 同一视图只有最后一次列表请求可以更新结果和加载状态
        async loadMatterList(tab) {
            if (!this.businessDomain) return;
            const view = this.captureView();
            const requestId = ++this.listRequestId;
            this.loading = true;
            try {
                const initiated = tab === 'initiated';
                const path = initiated ? '/api/v1/myMatters/queryMyInitiatedMattersPage' : '/api/v1/myMatters/queryMyMattersPage';
                const data = await this.apiPost(path, this.buildMatterQuery(initiated ? null : tab));
                if (!this.isCurrentView(view) || requestId !== this.listRequestId || tab !== this.activeTab) return;
                this.tableData = data.records || [];
                this.pagination.total = Number(data.total || 0);
                const countFields = { pending: 'pendingCount', completed: 'completedCount', initiated: 'initiatedCount' };
                this[countFields[tab]] = this.pagination.total;
            } catch (e) {
                if (this.isCurrentView(view) && requestId === this.listRequestId) {
                    this.tableData = [];
                    this.pagination.total = 0;
                    this[{ pending: 'pendingCount', completed: 'completedCount', initiated: 'initiatedCount' }[tab]] = 0;
                }
            } finally {
                if (this.isCurrentView(view) && requestId === this.listRequestId) {
                    this.loading = false;
                    this.refreshTableLayout('mattersTableRef');
                }
            }
        },

        // 重新计算指定表格固定列布局（数据渲染后 $nextTick + doLayout）
        refreshTableLayout(refName) {
            this.$nextTick(() => {
                const table = this.$refs[refName];
                if (table && typeof table.doLayout === 'function') {
                    table.doLayout();
                }
            });
        },

        // 重新计算当前页面所有表格固定列布局
        refreshAllTableLayout() {
            this.$nextTick(() => {
                Object.keys(this.$refs || {}).forEach(refName => {
                    const ref = this.$refs[refName];
                    const table = Array.isArray(ref) ? ref[0] : ref;
                    if (table && typeof table.doLayout === 'function') {
                        table.doLayout();
                    }
                });
            });
        },

        // 加载分级规则提醒列表（后端 gradeRuleAlert 接口不变）
        async loadAlertList() {
            if (this.businessDomain !== 'bond') return;
            const view = this.captureView();
            const requestId = ++this.alertRequestId;
            this.alertLoading = true;
            try {
                const data = await this.apiPost('/api/v1/gradeRuleAlert/queryAlertPage', {
                    currentUserId: this.currentUserId, securityCode: this.alertSearchForm.securityCode || null,
                    alertStatus: this.alertSearchForm.alertStatus || null,
                    pageIndex: this.alertPagination.pageIndex, pageSize: this.alertPagination.pageSize,
                });
                if (!this.isCurrentView(view) || requestId !== this.alertRequestId) return;
                this.alertTableData = data.records || [];
                this.alertPagination.total = Number(data.total || 0);
                this.alertOpenCount = this.alertPagination.total;
            } catch (e) {
                if (this.isCurrentView(view) && requestId === this.alertRequestId) { this.alertTableData = []; this.alertPagination.total = 0; this.alertOpenCount = 0; }
            } finally {
                if (this.isCurrentView(view) && requestId === this.alertRequestId) { this.alertLoading = false; this.refreshTableLayout('alertTableRef'); }
            }
        },

        // 触发查询
        handleSearch() {
            this.viewRevision++;
            if (this.isAlertTab) {
                this.alertPagination.pageIndex = 1;
                this.loadAlertList();
            } else if (this.activeTab === 'initiated') {
                this.pagination.pageIndex = 1;
                this.loadInitiatedList();
            } else {
                this.pagination.pageIndex = 1;
                this.loadList();
            }
        },

        // 切换事宜页签
        handleTabClick() {
            this.viewRevision++;
            if (this.isAlertTab) {
                this.alertPagination.pageIndex = 1;
                this.loadAlertList();
            } else if (this.activeTab === 'initiated') {
                this.pagination.pageIndex = 1;
                this.loadInitiatedList();
            } else {
                this.pagination.pageIndex = 1;
                this.loadList();
            }
        },

        // 重置查询条件
        handleReset() {
            this.viewRevision++;
            if (this.isAlertTab) {
                this.alertSearchForm = {
                    securityCode: '',
                    alertStatus: '00',
                };
                this.alertPagination.pageIndex = 1;
                this.loadAlertList();
                return;
            }
            this.searchForm = {
                flowIds: [],
                securityCode: '',
                securityShortName: '',
                startDateRange: null,
                processDescription: '',
                auditStatus: '',
                initiatorName: '',
            };
            this.pagination.pageIndex = 1;
            this.loadFlowOptions();
            if (this.activeTab === 'initiated') {
                this.loadInitiatedList();
            } else {
                this.loadList();
            }
        },

        // 翻页
        handlePageChange(page) {
            this.viewRevision++;
            this.pagination.pageIndex = page;
            if (this.activeTab === 'initiated') {
                this.loadInitiatedList();
            } else {
                this.loadList();
            }
        },

        // 切换每页条数
        handleSizeChange(size) {
            this.viewRevision++;
            this.pagination.pageSize = size;
            this.pagination.pageIndex = 1;
            if (this.activeTab === 'initiated') {
                this.loadInitiatedList();
            } else {
                this.loadList();
            }
        },

        // 提醒列表翻页
        handleAlertPageChange(page) {
            this.viewRevision++;
            this.alertPagination.pageIndex = page;
            this.loadAlertList();
        },

        // 提醒列表切换每页条数
        handleAlertSizeChange(size) {
            this.viewRevision++;
            this.alertPagination.pageSize = size;
            this.alertPagination.pageIndex = 1;
            this.loadAlertList();
        },

        // 从提醒跳转证券池调库（工作台内新开调库页签）
        openAlertAdjust(row) {
            if (this.businessDomain !== 'bond') return;
            const code = row.securityCode || '';
            const name = row.securityShortName || code;
            const params = new URLSearchParams();
            if (code) params.set('securityCode', code);
            const opened = window.RrsWorkbench.openDetailTab({
                index: window.RrsWorkbench.buildTabIndex('security-adjust', [code]),
                title: window.RrsWorkbench.formatDetailTitle(name, code, '调库'),
                page: this.pagePaths.securityPoolAdjust,
                query: params.toString(),
            });
            if (opened) return;
            params.set('loginUserId', this.currentUserId);
            params.set('loginUserName', this.currentUserName);
            window.location.href = this.pagePaths.securityPoolAdjust + '?' + params.toString();
        },

        // 标记提醒已处理，不改池
        async handleAlertProcessed(row) {
            const view = this.captureView();
            if (view.domain !== 'bond') return;
            try {
                await this.$confirm('确认将本条标记为已处理？不会自动改池，请先在证券池调库完成下调或出库。', '提示', {
                    type: 'warning',
                    confirmButtonText: '确定',
                    cancelButtonText: '取消',
                });
            } catch (e) {
                return;
            }
            if (!this.isCurrentView(view)) return;
            this.alertLoading = true;
            try {
                await this.apiPost('/api/v1/gradeRuleAlert/editAlertProcessed', {
                    id: row.id,
                    currentUserId: this.currentUserId,
                    currentUserName: this.currentUserName,
                });
                this.$message.success('已标记处理');
                if (this.isCurrentView(view)) this.loadAlertList();
            } catch (e) {
                if (this.isCurrentView(view)) {
                    this.alertLoading = false;
                    this.$message.error((e && e.message) || '处理失败');
                }
            }
        },

        // 打开对应审核/详情页（工作台内按记录新开页签，同键复用）
        openMatterPage(row) {
            const route = this.matterRoutes[row.businessScene];
            if (!route || route.domain !== row.businessDomain || row.businessDomain !== this.businessDomain) {
                this.$message.error('事项业务场景无效，请刷新后重试');
                return;
            }
            const params = new URLSearchParams();
            const isPending = this.activeTab === 'pending';
            const code = row.objectCode || '';
            const name = row.objectName || code;
            params.set('businessDomain', row.businessDomain);
            if (code) params.set(route.codeParam, code);
            if (row.crmwScode) params.set('crmwScode', row.crmwScode);
            if (row.targetPoolId) params.set('targetPoolId', row.targetPoolId);
            if (row.adjustLogId) params.set('adjustLogId', row.adjustLogId);
            if (row.adjustBatchNo) params.set('adjustBatchNo', row.adjustBatchNo);
            if (row.stepId) params.set('stepId', row.stepId);
            params.set('entryMode', isPending ? 'process' : 'view');
            const page = isPending ? route.approve : route.detail;
            const opened = window.RrsWorkbench.openDetailTab({
                index: window.RrsWorkbench.buildTabIndex('matter-' + (isPending ? 'approve' : 'detail'), [row.businessDomain, row.businessScene, code, row.crmwScode, row.adjustLogId, row.adjustBatchNo, row.targetPoolId]),
                title: window.RrsWorkbench.formatDetailTitle(name, code, isPending ? '审核' : '详情'),
                page: page, query: params.toString(),
            });
            if (opened) return;
            params.set('loginUserId', this.currentUserId);
            params.set('loginUserName', this.currentUserName);
            window.location.href = page + '?' + params.toString();
        },
    }
});
</script>
</body>
</html>
